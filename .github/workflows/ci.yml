name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q urai_router
      - name: Unit tests (local fake upstream, no keys)
        run: python -m pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build single-file zipapp
        run: |
          mkdir -p build/app
          cp -r urai_router build/app/
          python -m zipapp build/app -m "urai_router.cli:main" -o dist/urai-router.pyz
          chmod +x dist/urai-router.pyz
      - name: Smoke test wheel and zipapp
        run: |
          python -m pip install dist/urai_router-*.whl
          urai-router version
          urai-router --help >/dev/null
          python dist/urai-router.pyz version
      - uses: actions/upload-artifact@v4
        with:
          name: urai-router-dist
          path: dist/
